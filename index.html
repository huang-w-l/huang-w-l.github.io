<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="黄维霖的个人主页。欢迎通过邮箱 26S103019@stu.hit.edu.cn 与我联系。">
  <meta name="theme-color" content="#f6f9fe">
  <title>黄维霖 · 个人主页</title>
  <style>
    :root { color-scheme: light; --paper:#f6f9fe; --ink:#17325c; --muted:#5e718d; --line:#dbe5f3; --blue:#2563eb; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    .page { width:min(1120px,calc(100% - 96px)); margin:auto; }
    header { min-height:112px; display:flex; align-items:center; justify-content:space-between; gap:24px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; text-decoration:none; font-size:15px; font-weight:600; letter-spacing:.05em; }
    .brand-mark { display:grid; place-items:center; width:36px; height:36px; border:1px solid #a7bee4; border-radius:50%; font-family:Georgia,"Songti SC",serif; font-size:18px; }
    nav { display:flex; gap:30px; font-size:13px; }
    nav a { text-decoration:none; color:var(--muted); padding:10px 0; }
    nav a:hover { color:var(--ink); }
    main { min-height:calc(100svh - 206px); display:flex; align-items:center; padding:80px 0; }
    .hero { width:100%; display:grid; grid-template-columns:1.25fr 1fr; gap:80px; align-items:center; }
    .eyebrow { display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:.18em; font-weight:600; color:var(--muted); }
    .dot { width:7px; height:7px; border-radius:50%; background:#3b82f6; }
    h1 { margin:32px 0 23px; font-family:"Noto Serif SC","Songti SC",SimSun,serif; font-size:clamp(48px,6.5vw,78px); font-weight:500; letter-spacing:.08em; line-height:1.3; }
    .intro { margin:0; color:var(--muted); font-size:16px; line-height:2; }
    .actions { margin-top:38px; display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:28px; padding:15px 22px; background:var(--blue); color:white; text-decoration:none; border-radius:5px; font-size:14px; transition:background .2s,transform .2s; }
    .button:hover { background:#1d4ed8; transform:translateY(-2px); }
    .arrow { font-size:19px; line-height:1; }
    .card { position:relative; background:#eaf2ff; border:1px solid #d3e1f7; border-radius:16px; padding:40px 34px 30px; overflow:hidden; }
    .card-top { display:flex; justify-content:space-between; align-items:center; color:#627c9f; font-size:10px; letter-spacing:.18em; }
    .card-symbol { font-size:19px; }
    .emblem { position:relative; display:grid; place-items:center; width:164px; height:164px; margin:40px auto 36px; border:1px solid #b4cbef; border-radius:50%; }
    .emblem:before { content:""; position:absolute; width:136px; height:136px; border:1px solid #ccddf5; border-radius:50%; }
    .emblem span { font-family:"Songti SC",SimSun,serif; font-size:68px; font-weight:400; color:#2c60ac; z-index:1; }
    .card hr { margin:0 0 25px; border:0; border-top:1px solid #c9daf1; }
    .label { display:block; font-size:10px; letter-spacing:.16em; color:#627c9f; margin-bottom:12px; }
    .email { font-size:clamp(13px,1.4vw,15px); font-weight:500; text-decoration:none; overflow-wrap:anywhere; line-height:1.7; }
    .email:hover { text-decoration:underline; text-underline-offset:4px; }
    footer { min-height:94px; display:flex; justify-content:space-between; align-items:center; gap:20px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; line-height:1.8; }
    .footer-note { letter-spacing:.12em; font-size:10px; }
    a:focus-visible { outline:3px solid #60a5fa; outline-offset:6px; }
    @media(max-width:760px) {
      .page { width:calc(100% - 40px); }
      header { min-height:86px; }
      nav { gap:22px; }
      main { min-height:auto; padding:60px 0; }
      .hero { grid-template-columns:1fr; gap:48px; }
      h1 { margin-top:25px; font-size:56px; }
      .intro { font-size:15px; }
      .card { padding:28px; }
      .emblem { width:140px; height:140px; margin:30px auto; }
      .emblem:before { width:114px; height:114px; }
      .emblem span { font-size:58px; }
      .email { font-size:15px; }
      footer { padding:22px 0; min-height:86px; flex-wrap:wrap; gap:5px 20px; }
    }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .button { transition:none; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="#about" aria-label="黄维霖的个人主页"><span class="brand-mark" aria-hidden="true">黄</span><span>黄维霖</span></a>
      <nav aria-label="主导航"><a href="#about">关于</a><a href="#contact">联系</a></nav>
    </header>
    <main id="about">
      <div class="hero">
        <section aria-labelledby="name">
          <div class="eyebrow"><span class="dot" aria-hidden="true"></span>PERSONAL HOMEPAGE</div>
          <h1 id="name">黄维霖</h1>
          <p class="intro">你好，欢迎来到我的个人主页。<br>很高兴与你相遇，欢迎通过邮件与我联系。</p>
          <div class="actions"><a class="button" href="mailto:26S103019@stu.hit.edu.cn">发送邮件<span class="arrow" aria-hidden="true">↗</span></a></div>
        </section>
        <section class="card" id="contact" aria-label="联系方式">
          <div class="card-top"><span>LET’S CONNECT</span><span class="card-symbol" aria-hidden="true">✳</span></div>
          <div class="emblem" aria-hidden="true"><span>黄</span></div>
          <hr>
          <span class="label">EMAIL / 邮箱</span>
          <a class="email" href="mailto:26S103019@stu.hit.edu.cn">26S103019@stu.hit.edu.cn</a>
        </section>
      </div>
    </main>
    <footer><span>© 2026 黄维霖</span><span class="footer-note">谢谢你的到访 · THANKS FOR STOPPING BY</span></footer>
  </div>
</body>
</html>
